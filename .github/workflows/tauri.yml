name: Tauri 桌面版

on:
  push:
    branches: [main]
    # 源码在 tauri/ 子目录（仓库根级的 src-tauri/ 是不完整的副本，
    # 缺 icons/、main.rs、api.rs 等，不能用来构建）
    paths:
      - "tauri/**"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

# 编译日志要写到独立分支，必须显式给写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    env:
      # 在仓库 Settings -> Variables 配 OPENROUTER_API_KEY；没配则翻译走思知兜底
      OPENROUTER_API_KEY: ${{ vars.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 复制字体到构建目录
        shell: bash
        run: |
          # 思源宋体（22MB）放在仓库根级 public/fonts/，构建目录是 tauri/，
          # 这里复制过去，前端 @font-face 才能找到 /fonts/song.otf
          if [ -f public/fonts/song.otf ]; then
            mkdir -p tauri/public/fonts
            cp -f public/fonts/song.otf tauri/public/fonts/song.otf
            ls -l tauri/public/fonts/
          else
            echo "根级没有 public/fonts/song.otf，跳过"
          fi

      - name: 安装前端依赖
        working-directory: ./tauri
        run: npm install

      - name: 编译检查（输出日志）
        continue-on-error: true
        shell: bash
        run: |
          # 日志直接写进 ci/，保证后面的日志分支一定拿得到
          mkdir -p ci
          : > ci/build.log
          cd tauri
          npm run build > ../ci/build.log 2>&1
          echo "npm build exit=$?" >> ../ci/build.log
          cd ..
          cargo check --manifest-path tauri/src-tauri/Cargo.toml >> ci/build.log 2>&1
          echo "cargo check exit=$?" >> ci/build.log

      - name: 保存编译日志到独立分支
        if: always()
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          BR=log-tauri-${{ github.run_id }}
          git checkout -B "$BR"
          mkdir -p ci
          cp ci/build.log "ci/build-${{ matrix.platform }}.log" || echo "no log"
          git add -f "ci/build-${{ matrix.platform }}.log" || true
          git commit -m "ci: tauri build log ${{ matrix.platform }} ${{ github.run_id }}" || echo "no change"
          git push -f origin "$BR" || echo "push failed"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./tauri
          tagName: v__VERSION__
          releaseName: "GoMusic 桌面版 v__VERSION__"
          releaseBody: "Tauri 版桌面客户端（Vue 3 + Rust）。自动构建发布。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
