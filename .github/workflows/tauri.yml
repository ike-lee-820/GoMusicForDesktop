name: Tauri 桌面版

on:
  push:
    branches: [main]
    paths:
      - "tauri/**"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

# 需要写权限：编译日志要提交到 ci-logs 分支（GitHub 不允许下载 run 日志）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        working-directory: ./tauri
        run: npm install

      - name: 编译检查（输出日志）
        continue-on-error: true
        run: |
          set +e
          cd tauri
          npm run build > ../build.log 2>&1
          echo "npm build exit=$?" >> ../build.log
          cd ..
          cargo check --manifest-path tauri/src-tauri/Cargo.toml >> build.log 2>&1
          echo "cargo check exit=$?" >> build.log
          tail -400 build.log > build_tail.log

      - name: 保存编译日志
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@example.com
          git checkout -B ci-logs
          mkdir -p ci
          cp build_tail.log "ci/build-${{ matrix.platform }}.log"
          git add -f "ci/build-${{ matrix.platform }}.log"
          git commit -m "ci: build log (${{ matrix.platform }})" || echo "no change"
          git push -f origin ci-logs || echo "push failed"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./tauri
          tagName: v__VERSION__
          releaseName: "GoMusic 桌面版 v__VERSION__"
          releaseBody: "Tauri 版桌面客户端（Vue 3 + Rust）。自动构建发布。"
          releaseDraft: false
          prerelease: false
