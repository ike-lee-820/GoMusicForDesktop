name: Tauri 桌面版

on:
  push:
    branches: [main]
    paths:
      - "tauri/**"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

# 编译日志要写到独立分支，必须显式给写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        working-directory: ./tauri
        run: npm install

      - name: 编译检查（输出日志）
        continue-on-error: true
        shell: bash
        run: |
          cd tauri
          npm run build > ../build.log 2>&1
          echo "npm build exit=$?" >> ../build.log
          cd ..
          cargo check --manifest-path tauri/src-tauri/Cargo.toml >> build.log 2>&1
          echo "cargo check exit=$?" >> build.log
          tail -500 build.log > build_tail.log || true

      - name: 保存编译日志到独立分支
        if: always()
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          BR=log-tauri-${{ github.run_id }}
          git checkout -B "$BR"
          mkdir -p ci
          cp build_tail.log "ci/build-${{ matrix.platform }}.log" || echo "no log"
          git add -f "ci/build-${{ matrix.platform }}.log" || true
          git commit -m "ci: tauri build log ${{ matrix.platform }} ${{ github.run_id }}" || echo "no change"
          git push -f origin "$BR" || echo "push failed"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./tauri
          tagName: v__VERSION__
          releaseName: "GoMusic 桌面版 v__VERSION__"
          releaseBody: "Tauri 版桌面客户端（Vue 3 + Rust）。自动构建发布。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
