name: GoMusic 桌面版（原生安装包 exe / msi / dmg / deb）

on:
  push:
    branches: [main]
    paths:
      - "android-src/**"
      - "src/main/kotlin/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/compose-desktop.yml"
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            tasks: packageReleaseDeb
            formats: deb
          - os: windows-latest
            name: windows-x64
            tasks: packageReleaseExe packageReleaseMsi
            formats: exe msi
          - os: macos-latest
            name: macos-arm64
            tasks: packageReleaseDmg
            formats: dmg
          - os: macos-15-intel
            name: macos-x64
            tasks: packageReleaseDmg
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # jpackage 的平台依赖：Linux deb 要 fakeroot，Windows exe/msi 要 WiX 3。
      # 以前这里没有准备，Windows / macOS 的打包步骤会半路失败。
      - name: 准备 jpackage 依赖
        shell: bash
        run: |
          set -u
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y fakeroot
              ;;
            Windows)
              if ! command -v candle.exe >/dev/null 2>&1; then
                echo "WiX v3 未找到，尝试用 chocolatey 安装"
                choco install wixtoolset -y --no-progress || echo "choco 安装失败，继续（runner 可能已预装）"
                echo "C:\\Program Files (x86)\\WiX Toolset v3.11\\bin" >> "$GITHUB_PATH" || true
              fi
              ;;
            macOS)
              xcode-select -p || true
              ;;
          esac

      - name: 编译检查
        shell: bash
        run: |
          set -eu
          GRADLE=gradle
          if [ "${{ runner.os }}" = "Windows" ]; then GRADLE=gradle.bat; fi
          "$GRADLE" compileKotlin --no-daemon --stacktrace 2>&1 | tee compile.log
          exit ${PIPESTATUS[0]}

      # 每个格式单独跑：某个格式失败不影响同平台其它格式，也不拖垮其它 runner。
      - name: 生成原生安装包
        shell: bash
        run: |
          set -uo pipefail
          GRADLE=gradle
          if [ "${{ runner.os }}" = "Windows" ]; then GRADLE=gradle.bat; fi
          : > package.log
          for T in ${{ matrix.tasks }}; do
            echo "===== $T =====" | tee -a package.log
            if ! "$GRADLE" "$T" --no-daemon --stacktrace 2>&1 | tee -a package.log; then
              echo "::warning::$T 失败，继续尝试其它格式"
            fi
          done
          OK=0
          for E in ${{ matrix.formats }}; do
            if ls build/compose/binaries/main-release/$E/*.$E >/dev/null 2>&1; then OK=1; fi
          done
          if [ "$OK" != 1 ]; then
            echo "::error::${{ matrix.name }} 没有生成任何安装包"
            tail -80 package.log
            exit 1
          fi
          echo "产物："
          ls -lh build/compose/binaries/main-release/*/*.* 2>/dev/null || true

      # 不做 zip、不依赖 find/python3：以前 macOS 的 find 不支持 -maxdepth、
      # Windows Git Bash 没有 python3，这两处是「部分编译/打包失败」的来源。
      - name: 整理单文件安装包
        shell: bash
        run: |
          set -eu
          mkdir -p out
          for E in ${{ matrix.formats }}; do
            for F in build/compose/binaries/main-release/$E/*.$E; do
              [ -e "$F" ] || continue
              cp "$F" "out/GoMusic-26.11.9-${{ matrix.name }}.$E"
            done
          done
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: GoMusic-installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: 保存构建日志
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          BR="ci-log-desktop-${{ matrix.name }}-${{ github.run_id }}"
          git checkout -B "$BR"
          mkdir -p ci
          cp compile.log "ci/${{ matrix.name }}-compile.log" || true
          cp package.log "ci/${{ matrix.name }}-package.log" || true
          # jpackage 真正的错误在 err 日志里，Gradle 只报 exit code
          for F in build/compose/logs/*/*-err.txt build/compose/logs/*/*-out.txt; do
            [ -e "$F" ] || continue
            cp "$F" "ci/${{ matrix.name }}-$(basename "$F")" || true
          done
          git add -f ci/*.log ci/*.txt || true
          git commit -m "ci: desktop logs ${{ github.run_id }}" || echo "no change"
          git push -f origin "$BR" || true

  # 汇总到一次 release，避免四个 runner 并发创建同一个 tag 互相覆盖。
  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 发布安装包
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"
          ls -lh out/
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "GoMusic 桌面版 $TAG" \
              --notes "仅横屏的 Compose 桌面版，直接提供各平台原生安装包（exe / msi / dmg / deb），内置 JRE，双击安装即可。"
          fi
          gh release upload "$TAG" out/* --clobber
