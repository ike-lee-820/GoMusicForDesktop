name: Build Desktop

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x64
          - os: ubuntu-24.04-arm
            arch: linux-arm64
          - os: windows-latest
            arch: windows-x64
          - os: macos-15-intel
            arch: macos-x64
          - os: macos-14
            arch: macos-arm64
    runs-on: ${{ matrix.os }}
    # macos-13（Intel）Runner 正在退役，常常排不到队，允许失败不影响发布
    continue-on-error: ${{ matrix.optional == true }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Merge font chunks
        shell: bash
        run: |
          set -eu
          mkdir -p src/main/resources/fonts
          # 思源宋体太大，仓库里按 30MB 分片存放，构建前合并成完整字体
          cat fontchunks/song.ttf.00 fontchunks/song.ttf.01 > src/main/resources/fonts/song.ttf
          ls -l src/main/resources/fonts/
      - name: Build app image
        id: b
        continue-on-error: true
        run: |
          gradle createDistributable --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Dump jpackage logs
        if: always()
        shell: bash
        run: |
          find build/compose/logs -type f 2>/dev/null | while read f; do
            echo "=== $f" >> build.log
            cat "$f" >> build.log
          done
      - name: Publish log
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@example.com
          git checkout -B ci-logs-${{ matrix.arch }}
          mkdir -p ci
          cp build.log ci/build.log || true
          git add -f ci/build.log
          git commit -m "ci log ${{ matrix.arch }} $(date -u +%FT%TZ)" || echo none
          git push -f origin ci-logs-${{ matrix.arch }}
      - name: Fail if build failed
        if: steps.b.outcome == 'failure'
        run: |
          grep -E "^e:|FAILURE|error:" build.log | head -40
          exit 1

      # 用 python 打包：三个系统都自带 python3，且不依赖 zip / pwsh 差异
      - name: Package
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          ARCH="${{ matrix.arch }}"
          DIR="$ROOT/build/compose/binaries/main-release/app"
          if [ ! -d "$DIR" ]; then
            DIR=$(find "$ROOT/build/compose/binaries" -maxdepth 4 -type d -name app | head -1)
          fi
          echo "app dir = $DIR" | tee -a build.log
          ls -la "$DIR" | tee -a build.log
          python3 "$ROOT/ci/package.py" "$DIR" "$ROOT/GoMusic-$ARCH.zip" 2>&1 | tee -a build.log
          ls -l "$ROOT/GoMusic-$ARCH.zip"
      - name: Publish log (after package)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@example.com
          git checkout -B ci-logs-${{ matrix.arch }}
          mkdir -p ci
          cp build.log ci/build.log || true
          git add -f ci/build.log
          git commit -m "ci log ${{ matrix.arch }} $(date -u +%FT%TZ)" || echo none
          git push -f origin ci-logs-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: GoMusic-${{ matrix.arch }}
          path: GoMusic-${{ matrix.arch }}.zip

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 版本号从 build.gradle.kts 读，不再写死，避免和实际版本对不上
          VER=$(grep -m1 '^version = ' build.gradle.kts | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          TAG="v$VER"
          echo "release tag = $TAG"
          gh --version
          # 创建发布：已存在就跳过（并发/重跑时不会因已存在而失败）
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "GoMusic Desktop $TAG" \
              --notes "自动构建：Windows / Linux / macOS（x64 与 ARM64）" || \
              echo "release create 返回非零，继续尝试上传"
          fi
          shopt -s nullglob
          files=(out/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifact to upload"
            ls -R out || true
            exit 1
          fi
          # 逐个上传并重试：刚创建的发布会有短暂的索引延迟，直接传可能失败
          for f in "${files[@]}"; do
            echo "uploading $f"
            for i in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "  ok ($i)"
                break
              fi
              echo "  第 $i 次失败，5 秒后重试"
              sleep 5
              if [ "$i" = "3" ]; then exit 1; fi
            done
          done
