# 已废弃：桌面端已从 Compose Desktop 迁移到 Tauri（见 tauri.yml）。
# 这里保留只是留档，不再随 push 自动跑 —— 否则每次提交都会红一片。
# 需要手动验证旧版时，在 Actions 页面点 Run workflow。

name: Build Desktop (Compose, 已废弃)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x64
          - os: ubuntu-24.04-arm
            arch: linux-arm64
          - os: windows-latest
            arch: windows-x64
          - os: macos-15-intel
            arch: macos-x64
          - os: macos-14
            arch: macos-arm64
    runs-on: ${{ matrix.os }}
    # macos-13（Intel）Runner 正在退役，常常排不到队，允许失败不影响发布
    continue-on-error: ${{ matrix.optional == true }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Merge font chunks
        shell: bash
        run: |
          set -eu
          mkdir -p src/main/resources/fonts
          # 思源宋体太大，仓库里按 30MB 分片存放，构建前合并成完整字体
          cat fontchunks/song.ttf.00 fontchunks/song.ttf.01 > src/main/resources/fonts/song.ttf
          ls -l src/main/resources/fonts/
      - name: Build app image
        id: b
        continue-on-error: true
        run: |
          gradle createDistributable --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Dump jpackage logs
        if: always()
        shell: bash
        run: |
          find build/compose/logs -type f 2>/dev/null | while read f; do
            echo "=== $f" >> build.log
            cat "$f" >> build.log
          done
      - name: Publish log
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@example.com
          git checkout -B ci-logs-${{ matrix.arch }}
          mkdir -p ci
          cp build.log ci/build.log || true
          git add -f ci/build.log
          git commit -m "ci log ${{ matrix.arch }} $(date -u +%FT%TZ)" || echo none
          git push -f origin ci-logs-${{ matrix.arch }}
      - name: Fail if build failed
        if: steps.b.outcome == 'failure'
        run: |
          grep -E "^e:|FAILURE|error:" build.log | head -40
          exit 1

      # 用 python 打包：三个系统都自带 python3，且不依赖 zip / pwsh 差异
      - name: Package
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          ARCH="${{ matrix.arch }}"
          DIR="$ROOT/build/compose/binaries/main-release/app"
          if [ ! -d "$DIR" ]; then
            DIR=$(find "$ROOT/build/compose/binaries" -maxdepth 4 -type d -name app | head -1)
          fi
          echo "app dir = $DIR" | tee -a build.log
          ls -la "$DIR" | tee -a build.log
          python3 "$ROOT/ci/package.py" "$DIR" "$ROOT/GoMusic-$ARCH.zip" 2>&1 | tee -a build.log
          ls -l "$ROOT/GoMusic-$ARCH.zip"
      - name: Publish log (after package)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@example.com
          git checkout -B ci-logs-${{ matrix.arch }}
          mkdir -p ci
          cp build.log ci/build.log || true
          git add -f ci/build.log
          git commit -m "ci log ${{ matrix.arch }} $(date -u +%FT%TZ)" || echo none
          git push -f origin ci-logs-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: GoMusic-${{ matrix.arch }}
          path: GoMusic-${{ matrix.arch }}.zip
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          VER=$(grep -m1 '^version = ' build.gradle.kts | sed -E 's/version = "(.*)"/\1/')
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          TAG="v$VER"
          echo "release tag = $TAG"
          echo "token set = $([ -n "$GH_TOKEN" ] && echo yes || echo no)"
          df -h . || true
          shopt -s nullglob
          files=(out/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifact to upload"
            ls -R out || true
            exit 1
          fi
          ls -l out/
          API="https://api.github.com/repos/${{ github.repository }}"
          # 取 release id：单行 python，避免块标量缩进问题
          REL_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/releases/tags/$TAG" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))")
          if [ -z "$REL_ID" ]; then
            echo "creating release $TAG"
            RESP=$(curl -sS -w "\nHTTP:%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases" -d "{\"tag_name\":\"$TAG\",\"name\":\"GoMusic Desktop $TAG\",\"body\":\"auto build\"}")
            echo "$RESP" | tail -1
            REL_ID=$(echo "$RESP" | head -n -1 | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))")
          else
            echo "release exists id=$REL_ID"
          fi
          echo "REL_ID=$REL_ID"
          if [ -z "$REL_ID" ]; then echo "cannot get release id"; exit 1; fi
          fail=0
          for f in "${files[@]}"; do
            NAME=$(basename "$f")
            echo "== uploading $NAME ($(stat -c%s "$f") bytes)"
            OLD=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/releases/$REL_ID/assets" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((a['id'] for a in d if a['name']=='$NAME'),''))")
            if [ -n "$OLD" ]; then
              curl -sS -o /dev/null -w "  delete old: HTTP %{http_code}\n" -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$OLD"
            fi
            ok=0
            for i in 1 2 3; do
              BODY=$(mktemp)
              CODE=$(curl -sS -o "$BODY" -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/zip" --data-binary @"$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=$NAME")
              echo "  try $i -> HTTP $CODE"
              if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
                echo "  resp: $(head -c 400 "$BODY")"
              fi
              rm -f "$BODY"
              if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then ok=1; break; fi
              sleep 8
            done
            if [ "$ok" != "1" ]; then echo "  FAILED $NAME"; fail=1; fi
          done
          echo "RESULT fail=$fail"
          exit $fail
